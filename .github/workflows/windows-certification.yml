name: WorkIntel Windows Certification

on:
  pull_request:
  push:
    branches: [ops/finalize-release]

concurrency:
  group: final-physical-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-certification:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
    steps:
      - name: Report selected self-hosted runner
        run: |
          Write-Host "Selected runner: $env:RUNNER_NAME"
          Write-Host "Machine: $env:COMPUTERNAME"

      - name: Discover verify and sync real Laragon checkout
        run: |
          $laragonRoots = @()
          Get-PSDrive -PSProvider FileSystem | ForEach-Object {
            $candidate = Join-Path $_.Root 'laragon\www'
            if (Test-Path $candidate) { $laragonRoots += $candidate }
          }
          $laragonRoots = @($laragonRoots | Select-Object -Unique)
          Write-Host ('Laragon roots: ' + ($laragonRoots -join ', '))
          if ($laragonRoots.Count -eq 0) {
            throw 'No Laragon www root found on any mounted filesystem drive.'
          }

          $repoMatches = @()
          $markerMatches = @()
          foreach ($base in $laragonRoots) {
            $dirs = @((Get-Item $base)) + @(Get-ChildItem -Path $base -Directory -ErrorAction SilentlyContinue)
            foreach ($dir in $dirs) {
              $path = $dir.FullName
              if (-not (Test-Path (Join-Path $path '.git'))) { continue }

              $remote = (& git -c "safe.directory=$path" -C $path remote get-url origin 2>$null)
              if ($LASTEXITCODE -eq 0 -and $remote -match 'Vertex-Systems-Network/workforce-intelligence(?:\.git)?$') {
                $repoMatches += $path
                continue
              }

              if ((Test-Path (Join-Path $path 'verify-laragon-release.cmd')) -and (Test-Path (Join-Path $path 'artisan'))) {
                $markerMatches += $path
              }
            }
          }

          $matches = @($repoMatches | Select-Object -Unique)
          if ($matches.Count -eq 0) {
            $matches = @($markerMatches | Select-Object -Unique)
          }
          if ($matches.Count -ne 1) {
            Write-Host ('Repository matches: ' + (($repoMatches | Select-Object -Unique) -join ', '))
            Write-Host ('Marker matches: ' + (($markerMatches | Select-Object -Unique) -join ', '))
            throw "Expected exactly one Laragon WorkIntel checkout, found $($matches.Count)."
          }

          $root = $matches[0]
          Write-Host "Discovered Laragon checkout: $root"
          "WORKINTEL_LARAGON_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $branch = (& git -c "safe.directory=$root" -C $root branch --show-current).Trim()
          if ($branch -ne 'main') {
            throw "Real Laragon checkout must be on main; current branch is '$branch'."
          }
          $dirty = & git -c "safe.directory=$root" -C $root status --porcelain
          if ($dirty) {
            Write-Host $dirty
            throw 'Real Laragon checkout has uncommitted changes; refusing to modify or certify it.'
          }
          & git -c "safe.directory=$root" -C $root fetch origin main
          if ($LASTEXITCODE -ne 0) { throw 'git fetch origin main failed.' }
          & git -c "safe.directory=$root" -C $root pull --ff-only origin main
          if ($LASTEXITCODE -ne 0) { throw 'git pull --ff-only origin main failed.' }
          $head = (& git -c "safe.directory=$root" -C $root rev-parse HEAD).Trim()
          $originMain = (& git -c "safe.directory=$root" -C $root rev-parse origin/main).Trim()
          if ($head -ne $originMain) {
            throw "Laragon checkout HEAD $head does not match origin/main $originMain."
          }
          Write-Host "Laragon checkout target SHA: $head"

      - name: Run physical Laragon Windows plus MySQL certification
        run: |
          $root = $env:WORKINTEL_LARAGON_ROOT
          if (-not $root) { throw 'WORKINTEL_LARAGON_ROOT was not exported.' }
          Set-Location $root
          cmd /d /c verify-laragon-release.cmd
          if ($LASTEXITCODE -ne 0) {
            throw "verify-laragon-release.cmd failed with exit code $LASTEXITCODE."
          }
          $log = Get-ChildItem 'storage\logs\certification\laragon-release-*.log' -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $log) { throw 'Laragon certification did not produce an evidence log.' }
          $tail = Get-Content -Path $log.FullName -Tail 1
          if ($tail -ne 'WORKINTEL LARAGON RELEASE CERTIFICATION PASSED') {
            throw "Evidence log final line is invalid: $tail"
          }
          Write-Host "Physical evidence: $($log.FullName)"
          Copy-Item $log.FullName (Join-Path $env:RUNNER_TEMP 'workintel-laragon-release-evidence.log') -Force

      - name: Apply and verify main branch protection
        run: |
          $root = $env:WORKINTEL_LARAGON_ROOT
          if (-not $root) { throw 'WORKINTEL_LARAGON_ROOT was not exported.' }
          Set-Location $root
          cmd /d /c apply-main-branch-protection.cmd
          if ($LASTEXITCODE -ne 0) {
            throw "apply-main-branch-protection.cmd failed with exit code $LASTEXITCODE."
          }

      - name: Upload physical certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workintel-final-physical-release-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}\workintel-laragon-release-evidence.log
          if-no-files-found: warn
          retention-days: 30
