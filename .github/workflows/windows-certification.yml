name: WorkIntel Windows Certification

on:
  pull_request:

concurrency:
  group: final-main-protection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-certification:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
    steps:
      - name: Report selected self-hosted runner
        run: |
          Write-Host "Selected runner: $env:RUNNER_NAME"
          Write-Host "Machine: $env:COMPUTERNAME"

      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Resolve existing GitHub CLI admin session
        run: |
          if (-not (Get-Command gh -ErrorAction SilentlyContinue)) {
            throw 'GitHub CLI (gh) is not installed on this self-hosted runner.'
          }
          gh --version

          $resolved = $false
          gh auth status 1>$null 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Using GitHub CLI auth from the runner service profile.'
            $resolved = $true
          }

          if (-not $resolved) {
            $candidates = @()
            if (Test-Path 'C:\Users') {
              $candidates += @(Get-ChildItem 'C:\Users' -Directory -ErrorAction SilentlyContinue | ForEach-Object {
                Join-Path $_.FullName 'AppData\Roaming\GitHub CLI'
                Join-Path $_.FullName '.config\gh'
              })
            }

            foreach ($dir in ($candidates | Select-Object -Unique)) {
              if (-not (Test-Path (Join-Path $dir 'hosts.yml'))) { continue }
              $env:GH_CONFIG_DIR = $dir
              gh auth status 1>$null 2>$null
              if ($LASTEXITCODE -eq 0) {
                $login = (gh api user --jq .login).Trim()
                if ($LASTEXITCODE -ne 0 -or -not $login) { continue }
                Write-Host "Using authenticated GitHub CLI profile for: $login"
                "GH_CONFIG_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
                $resolved = $true
                break
              }
            }
          }

          if (-not $resolved) {
            throw 'No authenticated GitHub CLI profile was found on this Windows machine.'
          }

      - name: Apply and verify main branch protection
        run: |
          cmd /d /c apply-main-branch-protection.cmd
          if ($LASTEXITCODE -ne 0) {
            throw "apply-main-branch-protection.cmd failed with exit code $LASTEXITCODE."
          }
