name: Temporary Pint Autoformat

on:
  push:
    branches:
      - security/harden-auth-ssrf-oidc-2026-09-21

permissions:
  contents: write

jobs:
  pint-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - name: Format and commit changed PHP files
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only --diff-filter=ACMRT 9ea4d90bea31d4bf13ebf095a15468e3c75ea39c...HEAD -- '*.php' > /tmp/php-files.txt
          vendor/bin/pint $(cat /tmp/php-files.txt)
          if git diff --quiet -- $(cat /tmp/php-files.txt); then
            echo 'No Pint formatting changes are required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $(cat /tmp/php-files.txt)
          git commit -m 'style: apply Laravel Pint to security changes'
          git push origin HEAD:security/harden-auth-ssrf-oidc-2026-09-21
