name: WorkIntel Seed Stress

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite-seed-stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, xmlwriter, pdo_sqlite, sqlite3, fileinfo
          coverage: none
      - run: composer install --prefer-dist --no-interaction
      - run: cp .env.example .env && php artisan key:generate
      - name: Reproduce AccessControl SQLite seed flake
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: storage/framework/testing/seed-stress.sqlite
          DB_URL: ''
          WORKINTEL_SEED_STRESS_ALLOW_DESTRUCTIVE: '1'
          WORKINTEL_SEED_STRESS_CYCLES: 12
        run: bash tools/access-control-seed-stress.sh
      - name: Upload seed stress diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: access-control-seed-stress-${{ github.run_id }}-${{ github.run_attempt }}
          path: storage/logs/seed-stress
          if-no-files-found: warn
          retention-days: 14
