name: Desktop Agent Lock Bootstrap

on:
  push:
    branches:
      - harden/desktop-agent-release-determinism

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up exact Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.23.2'
      - name: Generate standalone lockfile
        working-directory: desktop-agent/standalone
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Verify locked standalone graph
        working-directory: desktop-agent/standalone
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=high
          sha256sum package-lock.json
      - name: Persist standalone lockfile
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop-agent/standalone/package-lock.json
          if git diff --cached --quiet; then
            echo 'Standalone lockfile already committed.'
            exit 0
          fi
          git commit -m 'chore: lock standalone agent build dependencies (#57)'
          git push origin "HEAD:${GITHUB_REF_NAME}"
