name: WorkIntel Pint Remediation Staging

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format-changed-php:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Apply Laravel Pint to changed PHP
        run: >-
          vendor/bin/pint
          app/Http/Controllers/Api/V1/InstallationController.php
          app/Http/Controllers/Api/V1/ReleaseController.php
          app/Services/Installation/ConfiguredReleaseBundleService.php
          app/Support/InstallationGuideCatalog.php
          config/workintel.php
          tests/Feature/InstallationCenterFlowTest.php
      - name: Commit Pint output
        shell: bash
        run: |
          git add app/Http/Controllers/Api/V1/InstallationController.php \
            app/Http/Controllers/Api/V1/ReleaseController.php \
            app/Services/Installation/ConfiguredReleaseBundleService.php \
            app/Support/InstallationGuideCatalog.php \
            config/workintel.php \
            tests/Feature/InstallationCenterFlowTest.php
          if git diff --cached --quiet; then
            echo "Pint made no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format UI remediation PHP changes"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
