name: E2E Auth Diagnostic

on:
  push:
    branches:
      - diagnostic/access-control-seed-on-dev08
  pull_request:

jobs:
  diagnose-auth-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, xmlwriter, pdo_sqlite, sqlite3, fileinfo
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: composer install --prefer-dist --no-interaction
      - run: cp .env.example .env && php artisan key:generate
      - name: Install frontend dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: php artisan migrate:fresh --seed --force
      - name: Show certification owner state
        run: php artisan tinker --execute="\$u=App\\Models\\User::where('email','owner@acme.test')->firstOrFail(); dump(['email'=>\$u->email,'status'=>\$u->status,'force_password_change'=>(bool)\$u->force_password_change,'verified'=>(bool)\$u->email_verified_at,'memberships'=>\$u->memberships()->where('status','active')->count(), 'password_ok'=>Illuminate\\Support\\Facades\\Hash::check('password',\$u->password)]);"
      - name: Run first authenticated browser journey with diagnostic context
        shell: bash
        env:
          WORKINTEL_E2E_MODE: full
          WORKINTEL_E2E_PROFILE: standard
        run: |
          set +e
          npx playwright test --config=tools/playwright.config.mjs tests/e2e/accessibility-platform.spec.mjs --project=desktop --grep "skip link reaches the main workspace landmark"
          status=$?
          echo "--- error contexts ---"
          find storage/app/private/e2e-results -name error-context.md -type f -print -exec cat {} \; 2>/dev/null || true
          echo "--- result files ---"
          find storage/app/private/e2e-results -maxdepth 3 -type f -print 2>/dev/null || true
          exit $status
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-auth-diagnostic
          path: storage/app/private/e2e-results
          if-no-files-found: ignore
