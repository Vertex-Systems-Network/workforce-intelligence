name: WorkIntel CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workintel-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect affected development scope
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
      database: ${{ steps.scope.outputs.database }}
      release: ${{ steps.scope.outputs.release }}
      governance: ${{ steps.scope.outputs.governance }}
      base: ${{ steps.scope.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: scope
        name: Classify changed paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BASE_SHA"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi

          backend=false
          frontend=false
          database=false
          release=false
          governance=false

          mapfile -t files < <(git diff --name-only --diff-filter=ACMRT "$base" HEAD)
          printf 'Changed files (%s):\n' "${#files[@]}"
          printf ' - %s\n' "${files[@]}"

          for file in "${files[@]}"; do
            case "$file" in
              app/*|bootstrap/*|config/*|routes/*|tests/Feature/*|tests/Unit/*|composer.json|composer.lock|phpunit.xml|artisan)
                backend=true
                ;;
            esac
            case "$file" in
              resources/*|public/*|tests/frontend/*|vite.config.ts|tsconfig*.json|package.json|package-lock.json|tools/*.mjs)
                frontend=true
                ;;
            esac
            case "$file" in
              database/*)
                backend=true
                database=true
                ;;
            esac
            case "$file" in
              desktop-agent/*|browser-extension/*|deploy/*|tools/build-releases.py|tools/release-*.py)
                release=true
                ;;
            esac
            case "$file" in
              .github/*|AGENTS.md|SECURITY.md|CONTRIBUTING.md|docs/architecture/REPOSITORY_GOVERNANCE.md)
                governance=true
                ;;
            esac
          done

          {
            echo "backend=$backend"
            echo "frontend=$frontend"
            echo "database=$database"
            echo "release=$release"
            echo "governance=$governance"
            echo "base=$base"
          } >> "$GITHUB_OUTPUT"

  backend-fast:
    name: Backend changed-scope gate
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, xmlwriter, pdo_sqlite, sqlite3, fileinfo
          coverage: none
      - name: Install locked PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Prepare local runtime
        run: cp .env.example .env && php artisan key:generate
      - name: Validate PHP dependency/runtime contract
        run: |
          composer validate --no-check-publish
          composer check-platform-reqs
          php tools/runtime-closure-preflight.php
      - name: Run backend unit contracts
        run: php artisan test --testsuite=Unit
      - name: Verify route boot
        run: php artisan route:list --except-vendor > /dev/null

  database-fast:
    name: Database changed-scope gate
    needs: changes
    if: needs.changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, xmlwriter, pdo_sqlite, sqlite3, fileinfo
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - name: Fresh SQLite migration and idempotent seed
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate:fresh --seed --force
          php artisan db:seed --force
          php artisan migrate:status

  frontend-fast:
    name: Frontend changed-scope gate
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Run frontend source contracts once
        run: node --test tests/frontend/*.test.mjs
      - name: TypeScript compile contract
        run: npx tsc --noEmit
      - name: Production compile smoke
        run: npx vite build

  release-fast:
    name: Release artifacts changed-scope gate
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify deterministic release packaging
        run: python3 tools/release-reproducibility-audit.py
      - name: Verify published release immutability
        run: python3 tools/release-immutability-audit.py

  governance:
    name: governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify repository governance source contract
        shell: bash
        run: |
          set -euo pipefail

          for path in \
            apply-main-branch-protection.cmd \
            tools/apply-main-branch-protection.ps1 \
            tests/Unit/MainBranchProtectionContractTest.php
          do
            if [ -e "$path" ]; then
              echo "Obsolete branch-protection artifact is still present: $path"
              exit 1
            fi
          done

          grep -Fq 'runs-on: windows-latest' .github/workflows/windows-certification.yml
          if grep -Fq 'self-hosted' .github/workflows/windows-certification.yml; then
            echo 'Windows certification must remain GitHub-hosted.'
            exit 1
          fi

          test -s package-lock.json
          grep -Fq 'npm ci --no-audit --no-fund' .github/workflows/ci.yml
          grep -Fq 'npm ci --no-audit --no-fund' .github/workflows/windows-certification.yml
          if grep -Eq '^[[:space:]]+(run:[[:space:]]+)?npm install --no-audit --no-fund([[:space:]]|$)' .github/workflows/ci.yml .github/workflows/windows-certification.yml; then
            echo 'Certification workflows must not fall back to unlocked npm install.'
            exit 1
          fi

          test -s desktop-agent/standalone/package-lock.json
          grep -Fq "node-version: '22.23.2'" .github/workflows/desktop-agent-release.yml
          grep -Fq 'npm ci --no-audit --no-fund' .github/workflows/desktop-agent-release.yml
          grep -Fq 'npm audit --audit-level=high' .github/workflows/desktop-agent-release.yml
          grep -Fq 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' .github/workflows/desktop-agent-release.yml
          grep -Fq 'actions/setup-node@820762786026740c76f36085b0efc47a31fe5020' .github/workflows/desktop-agent-release.yml
          grep -Fq 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' .github/workflows/desktop-agent-release.yml
          if grep -Eq 'uses: actions/(checkout|setup-node|upload-artifact)@v[0-9]+' .github/workflows/*.yml; then
            echo 'Official GitHub Actions must remain pinned to immutable commits.'
            exit 1
          fi
          if grep -Fq 'npm install' .github/workflows/desktop-agent-release.yml; then
            echo 'Desktop agent release must not use unlocked npm install.'
            exit 1
          fi

          grep -Fq 'not part of the active repository governance scope' docs/architecture/REPOSITORY_GOVERNANCE.md
          grep -Fq 'no branch-protection requirement' docs/architecture/REPOSITORY_GOVERNANCE.md
          grep -Fq 'branch protection was explicitly removed from the active governance scope' docs/architecture/MODULAR_MATURITY_STATUS.md

          echo 'Repository governance source contract passed.'

  development-gate:
    name: Development scoped checks
    if: github.event_name != 'workflow_dispatch' && always()
    needs: [changes, backend-fast, database-fast, frontend-fast, release-fast, governance]
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected development lane to pass
        shell: bash
        env:
          BACKEND: ${{ needs.backend-fast.result }}
          DATABASE: ${{ needs.database-fast.result }}
          FRONTEND: ${{ needs.frontend-fast.result }}
          RELEASE: ${{ needs.release-fast.result }}
          GOVERNANCE: ${{ needs.governance.result }}
        run: |
          set -euo pipefail
          for result in "$BACKEND" "$DATABASE" "$FRONTEND" "$RELEASE" "$GOVERNANCE"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "A selected scoped development lane did not pass."
              exit 1
            fi
          done
          echo 'All selected scoped development checks passed.'

  full-certification:
    name: Full release certification
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: workforce
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, xml, xmlwriter, pdo_mysql, pdo_sqlite, sqlite3, fileinfo
          coverage: none
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - run: composer install --prefer-dist --no-interaction
      - run: cp .env.example .env && php artisan key:generate
      - run: php tools/runtime-closure-preflight.php
      - run: php tools/runtime-closure-smoke.php
      - run: composer validate --no-check-publish
      - run: composer check-platform-reqs
      - name: Verify deterministic release packaging
        run: python3 tools/release-reproducibility-audit.py
      - name: Verify published release immutability
        run: python3 tools/release-immutability-audit.py
      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit locked frontend dependency graph
        run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium firefox
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run performance:audit:build
      - run: php artisan migrate:fresh --seed --force
      - run: php artisan db:seed --force
      - run: php artisan test
      - run: php artisan workintel:production-doctor --json --require-build
      - run: php artisan workintel:final-certification --json --require-build
      - run: npm run test:e2e:full
        env:
          WORKINTEL_RATE_AUTH_LOGIN: 120
      - name: Upload browser certification failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: workintel-e2e-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: storage/app/private/e2e-results
          if-no-files-found: warn
          retention-days: 7
      - run: npm run accessibility:audit
      - run: php artisan workintel:accessibility-doctor --json --require-build
      - run: npm run test:e2e:accessibility
        env:
          WORKINTEL_RATE_AUTH_LOGIN: 120
      - name: MySQL migration and seed smoke test
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: workforce
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan migrate:fresh --seed --force
      - run: php artisan route:list > /dev/null
      - run: php artisan schedule:list
