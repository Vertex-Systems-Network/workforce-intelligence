name: DEV-08 Typecheck Repair
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  apply-repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'dev-08-dead-duplicate-cleanup' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev-08-dead-duplicate-cleanup
          fetch-depth: 0
      - name: Apply verified TypeScript repair
        run: python tools/dev08-typecheck-fix.py
      - name: Run dependency-free regressions
        run: |
          git diff --check
          npm test
      - name: Commit repair and remove temporary runner
        run: |
          rm tools/dev08-typecheck-fix.py .github/workflows/dev08-typecheck-fix-pr.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            resources/js/components/RichTextEditor.tsx \
            resources/js/design-system/index.tsx \
            resources/js/design-system/layout.tsx \
            resources/js/documents/studio/DocumentStudioSupport.tsx \
            resources/js/pages/Automations.tsx \
            resources/js/pages/Chat.tsx \
            resources/js/pages/Clients.tsx \
            resources/js/pages/Documents.tsx \
            resources/js/pages/FinanceOps.tsx \
            resources/js/pages/Payroll.tsx \
            resources/js/pages/Reports.tsx \
            resources/js/pages/WebsiteStudio.tsx \
            tools/dev08-typecheck-fix.py \
            .github/workflows/dev08-typecheck-fix-pr.yml
          git commit -m "DEV-08: close real TypeScript CI blockers"
          git push origin HEAD:dev-08-dead-duplicate-cleanup
