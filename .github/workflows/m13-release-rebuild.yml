name: M13 Release Catalog Rebuild

on:
  push:
    branches:
      - feat/m13-agent-lifecycle-self-update

permissions:
  contents: write

jobs:
  rebuild:
    if: ${{ !contains(github.event.head_commit.message, '[skip release rebuild]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m13-agent-lifecycle-self-update
      - name: Rebuild release catalog
        run: python3 tools/build-releases.py
      - name: Commit generated packages
        shell: bash
        run: |
          set -euo pipefail
          git add storage/app/releases
          if git diff --cached --quiet; then
            echo 'Release catalog is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(m13): publish 1.2.0 release packages [skip release rebuild]'
          git push origin HEAD:feat/m13-agent-lifecycle-self-update
