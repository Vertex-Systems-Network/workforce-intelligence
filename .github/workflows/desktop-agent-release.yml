name: Desktop Agent Standalone Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'desktop-agent/native-agent.mjs'
      - 'desktop-agent/standalone/**'
      - '.github/workflows/desktop-agent-release.yml'
  push:
    tags: ['agent-v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up exact Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.23.2'
      - name: Install locked standalone build dependencies
        working-directory: desktop-agent/standalone
        run: npm ci --no-audit --no-fund
      - name: Audit locked standalone build graph
        working-directory: desktop-agent/standalone
        run: npm audit --audit-level=high
      - name: Build standalone agent
        working-directory: desktop-agent/standalone
        run: node build.mjs
      - name: Verify standalone artifact contract
        working-directory: desktop-agent/standalone
        run: >-
          node --input-type=commonjs -e
          "const fs=require('node:fs');const crypto=require('node:crypto');const expected=process.platform==='win32'?'WorkIntelAgent.exe':'WorkIntelAgent';const file='dist/'+expected;if(!fs.existsSync(file)||!fs.statSync(file).isFile()||fs.statSync(file).size===0)throw new Error('Missing or empty standalone artifact: '+file);const hash=crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');console.log(expected+' sha256='+hash+' bytes='+fs.statSync(file).size);"
      - name: Smoke standalone runtime
        working-directory: desktop-agent/standalone
        run: >-
          node --input-type=commonjs -e
          "const fs=require('node:fs');const os=require('node:os');const path=require('node:path');const {spawnSync}=require('node:child_process');const expected=process.platform==='win32'?'WorkIntelAgent.exe':'WorkIntelAgent';const exe=path.resolve('dist',expected);const home=fs.mkdtempSync(path.join(os.tmpdir(),'workintel-agent-smoke-'));try{const r=spawnSync(exe,['status'],{encoding:'utf8',env:{...process.env,WORKINTEL_AGENT_HOME:home}});if(r.status!==0)throw new Error('Standalone status failed: '+(r.stderr||r.stdout||'exit '+r.status));const data=JSON.parse(r.stdout);if(data.version!=='1.2.2'||data.enrolled!==false)throw new Error('Unexpected standalone status payload: '+r.stdout);console.log('Standalone runtime smoke passed: '+data.version);}finally{fs.rmSync(home,{recursive:true,force:true});}"
      - name: Upload standalone artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: workintel-agent-${{ runner.os }}
          path: desktop-agent/standalone/dist/WorkIntelAgent*
          if-no-files-found: error
