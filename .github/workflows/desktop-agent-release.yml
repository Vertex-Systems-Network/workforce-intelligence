name: Desktop Agent Standalone Build
on:
  workflow_dispatch:
  push:
    tags: ['agent-v*']
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - working-directory: desktop-agent/standalone
        run: npm install
      - working-directory: desktop-agent/standalone
        run: node build.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: workintel-agent-${{ runner.os }}
          path: desktop-agent/standalone/dist/WorkIntelAgent*
