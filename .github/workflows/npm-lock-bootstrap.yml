name: WorkIntel npm lock bootstrap

on:
  push:
    branches:
      - harden/npm-lock-determinism

permissions:
  contents: write

concurrency:
  group: workintel-npm-lock-bootstrap
  cancel-in-progress: true

jobs:
  generate-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Generate lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Prove lockfile installs deterministically
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit locked graph for high or critical vulnerabilities
        run: npm audit --audit-level=high
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v7
        with:
          name: workintel-package-lock-${{ github.sha }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1
      - name: Persist generated lockfile to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'package-lock.json already matches the generated graph.'
            exit 0
          fi
          git commit -m 'chore: pin frontend dependency graph (#55)'
          git push origin HEAD:harden/npm-lock-determinism
