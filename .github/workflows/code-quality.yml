name: WorkIntel Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workintel-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL JS/TS quality analysis
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - name: Analyze JavaScript and TypeScript
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          category: /language:javascript-typescript

  pint-changed-php:
    name: Laravel Pint changed-PHP quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Check changed PHP files with Laravel Pint
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BASE_SHA"
          fi

          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi

          mapfile -t php_files < <(git diff --name-only --diff-filter=ACMRT "$base" HEAD -- '*.php')
          if [ "${#php_files[@]}" -eq 0 ]; then
            echo 'No changed PHP files require Pint validation.'
            exit 0
          fi

          printf 'Pint validating %s changed PHP file(s):\n' "${#php_files[@]}"
          printf ' - %s\n' "${php_files[@]}"
          if vendor/bin/pint --test "${php_files[@]}"; then
            exit 0
          fi

          # Keep the quality gate failing, but show the formatter's exact expected delta.
          # This checkout is ephemeral and changes never reach protected main from CI.
          echo '::group::Pint suggested formatting diff (diagnostics only)'
          vendor/bin/pint "${php_files[@]}" >/dev/null
          git --no-pager diff -- "${php_files[@]}"
          echo '::endgroup::'
          exit 1
