name: WorkIntel Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workintel-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL JS/TS quality analysis
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - name: Analyze JavaScript and TypeScript
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript

  pint-changed-php:
    name: Laravel Pint changed-PHP quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Check changed PHP files with Laravel Pint
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BASE_SHA"
          fi

          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi

          mapfile -t php_files < <(git diff --name-only --diff-filter=ACMRT "$base" HEAD -- '*.php')
          if [ "${#php_files[@]}" -eq 0 ]; then
            echo 'No changed PHP files require Pint validation.'
            exit 0
          fi

          printf 'Pint validating %s changed PHP file(s):\n' "${#php_files[@]}"
          printf ' - %s\n' "${php_files[@]}"
          vendor/bin/pint --test "${php_files[@]}"

  m13-updater-hardening:
    name: M13 one-shot updater hardening
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/m13-agent-lifecycle-self-update'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Remove network-to-file sink and rebuild release packages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          agent_path = Path('desktop-agent/native-agent.mjs')
          agent = agent_path.read_text(encoding='utf-8')
          if 'function downloadManagedArchive(' not in agent:
              marker = "/** Downloads, verifies, stages, and atomically replaces the managed native-agent source. */ async function installManagedUpdate(config) {"
              helper = r'''/** Downloads one managed archive through curl into an already-open secure descriptor. */ function downloadManagedArchive(config, archivePath, headersPath) {
  if(!commandExists('curl'))throw new Error('curl is required for managed agent updates.')
  const endpoint=trustedRequestUrl(config,'/api/v1/agent/release/download')
  const token=String(config?.access_token||'')
  if(!token||/[\r\n\0]/u.test(token))throw new Error('Managed update token is invalid.')
  const archiveFd=openSync(archivePath,'wx',0o600)
  try{
    const result=spawnSync('curl',[
      '--fail','--silent','--show-error','--no-progress-meter','--connect-timeout','10','--max-time','120',
      '--proto',endpoint.protocol==='https:'?'=https':'=http','--dump-header',headersPath,
      '--header','Accept: application/zip','--header','@-',endpoint.toString()
    ],{input:`Authorization: Bearer ${token}\r\n`,stdio:['pipe',archiveFd,'pipe'],encoding:'utf8',windowsHide:true})
    if(result.error)throw result.error
    if(result.status!==0)throw new Error(`Update download failed: ${String(result.stderr||'curl failed').trim()}`)
  }finally{closeSync(archiveFd)}
  const headers=readFileSync(headersPath,'utf8')
  const status=Number(headers.match(/^HTTP\/\S+\s+(\d{3})/mi)?.[1]||0)
  if(status<200||status>=300)throw new Error(`Update download failed with HTTP ${status||'unknown'}`)
  return {
    sha256:headers.match(/^x-release-sha256:\s*([^\r\n]+)/mi)?.[1]?.trim()||null,
    version:headers.match(/^x-workintel-version:\s*([^\r\n]+)/mi)?.[1]?.trim()||null,
  }
}

'''
              if marker not in agent:
                  raise SystemExit('installManagedUpdate marker not found')
              agent = agent.replace(marker, helper + marker, 1)

          old = r'''  const response=await authenticatedRequest(config,'/api/v1/agent/release/download',{headers:{Accept:'application/zip'}})
  if(!response.ok){const payload=await response.json().catch(()=>null);throw new Error(payload?.message||`Update download failed with HTTP ${response.status}`)}
  const headerHash=response.headers.get('x-release-sha256')
  const headerVersion=response.headers.get('x-workintel-version')
  if(headerHash&&headerHash.toLowerCase()!==managed.sha256.toLowerCase())throw new Error('Update response checksum does not match release metadata.')
  if(headerVersion&&headerVersion!==managed.version)throw new Error('Update response version does not match release metadata.')
  const archiveBytes=Buffer.from(await response.arrayBuffer())
  const actualHash=createHash('sha256').update(archiveBytes).digest('hex')
  if(actualHash.toLowerCase()!==managed.sha256.toLowerCase())throw new Error('Downloaded update failed SHA-256 verification.')

  const updateDir=mkdtempSync(resolve(tmpdir(),'workintel-update-'))
  const archivePath=resolve(updateDir,'release.zip')
  const extractDir=resolve(updateDir,'extract')
  const currentPath=resolve(root,'native-agent.mjs')
  const stagedPath=resolve(root,`native-agent.mjs.next-${randomUUID()}`)
  const backupPath=resolve(root,'native-agent.mjs.previous')
  mkdirSync(extractDir,{mode:0o700})
  try{
    writeFileSync(archivePath,archiveBytes,{flag:'wx',mode:0o600})
'''
          new = r'''  const updateDir=mkdtempSync(resolve(tmpdir(),'workintel-update-'))
  const archivePath=resolve(updateDir,'release.zip')
  const headersPath=resolve(updateDir,'release.headers')
  const extractDir=resolve(updateDir,'extract')
  const currentPath=resolve(root,'native-agent.mjs')
  const stagedPath=resolve(root,`native-agent.mjs.next-${randomUUID()}`)
  const backupPath=resolve(root,'native-agent.mjs.previous')
  mkdirSync(extractDir,{mode:0o700})
  try{
    const responseMeta=downloadManagedArchive(config,archivePath,headersPath)
    if(responseMeta.sha256&&responseMeta.sha256.toLowerCase()!==managed.sha256.toLowerCase())throw new Error('Update response checksum does not match release metadata.')
    if(responseMeta.version&&responseMeta.version!==managed.version)throw new Error('Update response version does not match release metadata.')
    const actualHash=createHash('sha256').update(readFileSync(archivePath)).digest('hex')
    if(actualHash.toLowerCase()!==managed.sha256.toLowerCase())throw new Error('Downloaded update failed SHA-256 verification.')
'''
          if old in agent:
              agent = agent.replace(old, new, 1)
          elif 'writeFileSync(archivePath,archiveBytes' in agent or 'response.arrayBuffer()' in agent:
              raise SystemExit('unexpected updater sink shape')
          agent_path.write_text(agent, encoding='utf-8')

          test_path = Path('tests/frontend/agent-lifecycle-m13.test.mjs')
          test = test_path.read_text(encoding='utf-8')
          old_test = "  for(const token of ['trustedRequestUrl','redirect:\\'error\\'','mkdtempSync',\"flag:'wx'\",\"mode:0o600\",'Agent request origin is not trusted.'])assert.ok(agent.includes(token),token)\n"
          new_test = "  for(const token of ['trustedRequestUrl','redirect:\\'error\\'','mkdtempSync',\"openSync(archivePath,'wx',0o600)\",\"spawnSync('curl'\",'Agent request origin is not trusted.'])assert.ok(agent.includes(token),token)\n  assert.ok(!agent.includes('writeFileSync(archivePath'))\n  assert.ok(!agent.includes('response.arrayBuffer()'))\n  assert.ok(!agent.includes(\"'--location'\"))\n"
          if old_test in test:
              test = test.replace(old_test, new_test, 1)
          test_path.write_text(test, encoding='utf-8')

          docs_path = Path('desktop-agent/PRODUCTION_AGENT.md')
          docs = docs_path.read_text(encoding='utf-8')
          docs = docs.replace(
              'The agent accepts only the same-origin `/api/v1/agent/release/download` path, verifies the release metadata checksum format, downloads with its device token, verifies the response version and SHA-256, extracts into an isolated temporary directory, checks that the candidate contains the expected `desktop-agent/native-agent.mjs`, verifies the candidate version and runs `node --check` before replacing the installed source.',
              'The agent accepts only the same-origin `/api/v1/agent/release/download` path, verifies the release metadata checksum format, and requires the operating-system `curl` command for managed downloads. The bearer token is passed to curl through standard input rather than process arguments; curl streams the archive into an exclusive file descriptor inside an isolated random temporary directory. The agent verifies response metadata and the downloaded SHA-256 before extraction, then checks that the candidate contains the expected `desktop-agent/native-agent.mjs`, verifies the candidate version and runs `node --check` before replacing the installed source.'
          )
          docs_path.write_text(docs, encoding='utf-8')

          build_path = Path('tools/build-releases.py')
          build = build_path.read_text(encoding='utf-8')
          build = build.replace("'Windows 10/11, Node.js 20+, PowerShell 5+'", "'Windows 10/11, Node.js 20+, PowerShell 5+, curl'")
          build = build.replace("'macOS 12+, Node.js 20+'", "'macOS 12+, Node.js 20+, curl'")
          build = build.replace("'Modern Linux desktop, Node.js 20+, systemd user session'", "'Modern Linux desktop, Node.js 20+, curl, systemd user session'")
          build_path.write_text(build, encoding='utf-8')
          PY
          node --check desktop-agent/native-agent.mjs
          node --test tests/frontend/agent-lifecycle-m13.test.mjs
          python3 tools/build-releases.py
          git add desktop-agent/native-agent.mjs desktop-agent/PRODUCTION_AGENT.md tests/frontend/agent-lifecycle-m13.test.mjs tools/build-releases.py storage/app/releases
          if git diff --cached --quiet; then
            echo 'M13 updater is already hardened.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(m13): remove network-to-file updater sink'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
