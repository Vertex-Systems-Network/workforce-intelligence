version: 2

updates:
  # =========================================================
  # NPM / Node.js
  # =========================================================
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Karachi"
    cooldown:
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 5
    groups:
      development-minor-patch:
        applies-to: "version-updates"
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-patches:
        applies-to: "version-updates"
        dependency-type: "production"
        update-types:
          - "patch"
    ignore:
      # Runtime baseline is Node 22; keep declaration majors aligned until the runtime moves.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      # TypeScript 7 uses the native compiler and is incompatible with the current JS compiler-API audit.
      - dependency-name: "typescript"
        versions:
          - "7.x"
      # TanStack Table 9 requires an intentional API migration rather than an automated major bump.
      - dependency-name: "@tanstack/react-table"
        versions:
          - "9.x"
    commit-message:
      prefix: "chore"
      include: "scope"

  # =========================================================
  # Composer / PHP
  # =========================================================
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
      timezone: "Asia/Karachi"
    cooldown:
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 5
    groups:
      development-minor-patch:
        applies-to: "version-updates"
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-patches:
        applies-to: "version-updates"
        dependency-type: "production"
        update-types:
          - "patch"
    commit-message:
      prefix: "chore"
      include: "scope"

  # =========================================================
  # GitHub Actions
  # =========================================================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "09:00"
      timezone: "Asia/Karachi"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
