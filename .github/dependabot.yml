version: 2

updates:
  # =========================================================
  # NPM / Node.js
  # =========================================================
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Karachi"
    cooldown:
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    # Three npm PRs can consume up to nine repository certification jobs.
    # Keep enough headroom for Composer, Actions and feature PR governance.
    open-pull-requests-limit: 3
    groups:
      development-minor-patch:
        applies-to: "version-updates"
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-patches:
        applies-to: "version-updates"
        dependency-type: "production"
        update-types:
          - "patch"
    # Keep Node declaration files on the same runtime major that WorkIntel
    # certifies in package.json and CI. Security updates remain unaffected.
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "chore"
      include: "scope"

  # =========================================================
  # Composer / PHP
  # =========================================================
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
      timezone: "Asia/Karachi"
    cooldown:
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 2
    groups:
      development-minor-patch:
        applies-to: "version-updates"
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-patches:
        applies-to: "version-updates"
        dependency-type: "production"
        update-types:
          - "patch"
    commit-message:
      prefix: "chore"
      include: "scope"

  # =========================================================
  # GitHub Actions
  # =========================================================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "09:00"
      timezone: "Asia/Karachi"
    cooldown:
      default-days: 7
    # Minor/patch Actions move together; majors stay isolated for explicit
    # runtime/security review instead of multiplying low-risk CI fan-out.
    open-pull-requests-limit: 2
    groups:
      routine-actions:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore"
      include: "scope"
